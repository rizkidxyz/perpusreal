services:
  - type: web
    name: perpus-realtime
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APPS_SCRIPT_URL
        sync: false
      - key: API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
